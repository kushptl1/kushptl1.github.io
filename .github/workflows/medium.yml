name: Refresh Medium posts

on:
  schedule:
    - cron: "17 6 * * *" # daily, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest posts
        run: python3 scripts/fetch_medium.py

      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain assets/posts.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/posts.json
            git commit -m "Refresh Medium posts"
            git push
          else
            echo "No change."
          fi
